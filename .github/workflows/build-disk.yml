---
name: Build disk images

on:
    workflow_dispatch:
        inputs:
            upload-to-s3:
                description: "Upload to S3"
                required: false
                default: false
                type: boolean

            platform:
                description: "Runner / target platform"
                required: true
                default: amd64
                type: choice
                options:
                    - amd64
                    - arm64

            image-name:
                description: "Container image name to build disk from"
                required: true
                default: asdx
                type: choice
                options:
                    - asdx
                    - asdx-arm64

            image-tag:
                description: "Container image tag"
                required: true
                default: latest
                type: string

            artifact-type:
                description: "Disk artifact type"
                required: true
                default: qcow2
                type: choice
                options:
                    - qcow2
                    - iso

    pull_request:
        branches:
            - main
        paths:
            - "disk_config/disk.toml"
            - ".github/workflows/build-disk.yml"

env:
    IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
    DEFAULT_IMAGE_NAME: asdx
    DEFAULT_TAG: latest
    BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
    cancel-in-progress: true

jobs:
    build:
        name: Build disk image
        runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}

        permissions:
            contents: read
            packages: read
            id-token: write

        steps:
            - name: Prepare environment
              run: |
                  USER_UID=$(id -u)
                  USER_GID=$(id -g)

                  echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
                  echo "USER_UID=${USER_UID}" >> "${GITHUB_ENV}"
                  echo "USER_GID=${USER_GID}" >> "${GITHUB_ENV}"
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    image_name="${{ inputs['image-name'] }}"
                    image_tag="${{ inputs['image-tag'] }}"
                    artifact_type="${{ inputs['artifact-type'] }}"
                    echo "IMAGE_NAME=${image_name:-${DEFAULT_IMAGE_NAME}}" >> "${GITHUB_ENV}"
                    echo "IMAGE_TAG=${image_tag:-${DEFAULT_TAG}}" >> "${GITHUB_ENV}"
                    echo "ARTIFACT_TYPE=${artifact_type:-qcow2}" >> "${GITHUB_ENV}"
                  else
                    echo "IMAGE_NAME=${DEFAULT_IMAGE_NAME}" >> "${GITHUB_ENV}"
                    echo "IMAGE_TAG=${DEFAULT_TAG}" >> "${GITHUB_ENV}"
                    echo "ARTIFACT_TYPE=qcow2" >> "${GITHUB_ENV}"
                  fi

            - name: Maximize build space
              if: github.event_name != 'workflow_dispatch' || inputs.platform != 'arm64'
              uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
              with:
                  remove-codeql: true

            - name: Install dependencies
              run: |
                  set -x
                  sudo apt-get update
                  sudo apt-get install -y containernetworking-plugins podman

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

            - name: Show selected image
              run: |
                  echo "Building from: ${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
                  echo "Artifact type: ${ARTIFACT_TYPE}"
                  echo "Runner arch: $(uname -m)"

            - name: Build disk image
              id: build
              shell: bash
              run: |
                  set -euo pipefail

                  image_ref="${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG:-${DEFAULT_TAG}}"
                  output_dir="${PWD}/output"

                  sudo rm -rf "${output_dir}"
                  mkdir -p "${output_dir}"

                  sudo podman pull "${BIB_IMAGE}"
                  sudo podman pull "${image_ref}"
                  sudo podman run \
                    --rm \
                    --privileged \
                    --pull=newer \
                    --net=host \
                    --security-opt label=type:unconfined_t \
                    --volume "${PWD}/disk_config/disk.toml:/config.toml:ro" \
                    --volume "${output_dir}:/output" \
                    --volume /var/lib/containers/storage:/var/lib/containers/storage \
                    "${BIB_IMAGE}" \
                    --output /output \
                    --chown "${USER_UID}:${USER_GID}" \
                    --rootfs ext4 \
                    --use-librepo=True \
                    --type "${ARTIFACT_TYPE}" \
                    "${image_ref}"

                  echo "output-directory=${output_dir}" >> "${GITHUB_OUTPUT}"

            - name: Upload disk image and checksum to job artifacts
              if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}-${{ env.ARTIFACT_TYPE }}
                  path: ${{ steps.build.outputs.output-directory }}
                  if-no-files-found: error
                  retention-days: 7
                  compression-level: 0
                  overwrite: true

            - name: Upload to S3
              if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
              shell: bash
              env:
                  RCLONE_CONFIG_S3_TYPE: s3
                  RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
                  RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
                  RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
                  RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
                  RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
                  SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
              run: |
                  sudo apt-get update
                  sudo apt-get install -y rclone
                  rclone copy "${SOURCE_DIR}" "S3:${{ secrets.S3_BUCKET_NAME }}"
